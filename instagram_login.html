<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>instagram — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Billabong&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .page-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.65rem;
    width: 100%;
    max-width: 400px;
  }

  .card {
    background: #fff;
    border-radius: 4px;
    border: 1px solid #dbdbdb;
    padding: 2.5rem 2.5rem 1.5rem;
    width: 100%;
    text-align: center;
  }

  .logo-text {
    font-size: 2.6rem;
    background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 1.8rem;
    letter-spacing: 1px;
    font-family: 'Billabong', cursive;
  }

  .input-group {
    margin-bottom: 0.55rem;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"] {
    width: 100%;
    background: #fafafa;
    border: 1px solid #dbdbdb;
    border-radius: 4px;
    padding: 0.65rem 1rem;
    font-size: 0.85rem;
    color: #262626;
    outline: none;
    transition: border-color 0.15s;
    font-family: inherit;
  }

  input:focus {
    border-color: #a8a8a8;
    background: #fff;
  }

  .password-wrap {
    position: relative;
  }

  .show-pass {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.78rem;
    font-weight: 700;
    color: #262626;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
  }

  .login-btn {
    width: 100%;
    margin-top: 0.55rem;
    padding: 0.65rem;
    background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 0.9rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s;
    letter-spacing: 0.3px;
  }

  .login-btn:hover { opacity: 0.88; }

  .forgot {
    display: block;
    margin-top: 1rem;
    font-size: 0.78rem;
    color: #00376b;
    text-decoration: none;
    cursor: pointer;
  }

  .forgot:hover { text-decoration: underline; }

  .footer-card {
    background: #fff;
    border: 1px solid #dbdbdb;
    border-radius: 4px;
    padding: 1.1rem;
    text-align: center;
    width: 100%;
    font-size: 0.88rem;
    color: #262626;
  }

  .footer-card a {
    color: #0095f6;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }

  .copyright {
    color: rgba(255,255,255,0.7);
    font-size: 0.72rem;
    margin-top: 0.3rem;
  }

  .error-msg {
    font-size: 0.78rem;
    color: #ed4956;
    margin-top: 0.4rem;
    display: none;
  }
</style>
</head>
<body>

<div class="page-wrap">

  <div class="card">

    <div class="logo-text">instagram</div>

    <div class="input-group">
      <input type="email" placeholder="Email" id="email" autocomplete="off" />
    </div>

    <div class="input-group password-wrap">
      <input type="password" placeholder="Password" id="pass" autocomplete="off" />
      <button class="show-pass" onclick="togglePass()">Show</button>
    </div>

    <div class="error-msg" id="error">Please enter your email and password.</div>

    <button class="login-btn" onclick="handleLogin()">Log In</button>

    <a class="forgot" href="#">Forgot password?</a>

  </div>

  <div class="footer-card">
    Don't have an account? <a href="#">Sign up</a>
  </div>

  <div class="copyright">© 2026 instagram — All rights reserved</div>

</div>

<script>
  function togglePass() {
    const p = document.getElementById('pass');
    const btn = document.querySelector('.show-pass');
    if (p.type === 'password') { p.type = 'text'; btn.textContent = 'Hide'; }
    else { p.type = 'password'; btn.textContent = 'Show'; }
  }

  function handleLogin() {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value.trim();
    const err = document.getElementById('error');
    const btn = document.querySelector('.login-btn');

    if (!email || !pass) {
      err.style.display = 'block';
      return;
    }

    err.style.display = 'none';
    btn.textContent = 'Logging in...';
    btn.style.opacity = '0.75';
    setTimeout(() => {
      btn.textContent = 'Log In';
      btn.style.opacity = '1';
    }, 2000);
  }
</script>
</body>
</html>
